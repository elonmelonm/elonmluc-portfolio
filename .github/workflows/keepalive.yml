name: Supabase keep-alive

# Empêche la mise en pause du projet Supabase (free tier : pause après 7j d'inactivité).
# Secrets requis (Settings > Secrets and variables > Actions) :
#   SUPABASE_URL       -> https://<ref>.supabase.co
#   SUPABASE_ANON_KEY  -> clé anon publique (jamais la service_role)

on:
  schedule:
    - cron: '17 6 * * *' # tous les jours à 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          curl -fsS \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/projects?select=id&limit=1"
